[workspace]
members = [
    "dyno",
    "gps",
    "minimap",
    "map-waypoints",
    "poi-database",
    "farever-poi-protocol",
    "farever-waypoint-protocol",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
farever-more-sdk = { path = "../farever-more-sdk" }
farever-poi-protocol = { path = "farever-poi-protocol" }
farever-waypoint-protocol = { path = "farever-waypoint-protocol" }
# Test-only JSON parsing (native drift guard); never linked into guests.
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
