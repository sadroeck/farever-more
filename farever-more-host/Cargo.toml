[package]
name = "farever-more-host"
# Independent from the workspace version: the runtime (host + proxy) ships on
# its own cadence, and installers stamp this version into runtime.json.
version = "0.3.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
farever-more-runtime = { path = "../farever-more-runtime" }
