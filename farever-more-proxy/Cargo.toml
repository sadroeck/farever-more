[package]
name = "farever-more-proxy"
# Independent from the workspace version: the runtime (host + proxy) ships on
# its own cadence, and installers stamp this version into runtime.json.
version = "0.1.0"
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
windows-sys.workspace = true
